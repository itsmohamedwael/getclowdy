<svg xmlns="http://www.w3.org/2000/svg" width="260" height="50" viewBox="0 0 260 50" fill="none">
  <defs>
    <linearGradient id="lavaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF416C" />
      <stop offset="100%" stop-color="#FF4B2B" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#FF416C" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Button Background -->
  <rect x="3" y="3" width="254" height="44" rx="22" fill="url(#lavaGrad)" filter="url(#shadow)"/>
  <rect x="3.5" y="3.5" width="253" height="43" rx="21.5" stroke="#FFFFFF" stroke-opacity="0.25" stroke-width="1"/>

  <!-- Coffee / Heart Icon -->
  <g transform="translate(24, 15)">
    <!-- Cup -->
    <path d="M1 4h12v7a4 4 0 0 1-4 4H5a4 4 0 0 1-4-4V4z" fill="#FFFFFF"/>
    <!-- Handle -->
    <path d="M13 5.5h2a2 2 0 0 1 2 2v0a2 2 0 0 1-2 2h-2" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round"/>
    <!-- Steam Lines -->
    <path d="M4 1.5c0-.8.6-1.5 1.2-1.5s1.2.7 1.2 1.5" stroke="#FFFFFF" stroke-width="1.2" stroke-linecap="round" opacity="0.8"/>
    <path d="M8 1.5c0-.8.6-1.5 1.2-1.5s1.2.7 1.2 1.5" stroke="#FFFFFF" stroke-width="1.2" stroke-linecap="round" opacity="0.8"/>
  </g>

  <!-- Text -->
  <text x="52" y="30" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="700" letter-spacing="0.3">
    Leave a Tip on Lava.top
  </text>
  
  <!-- Arrow -->
  <path d="M232 25l-4-4m4 4l-4 4" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="0.85"/>
</svg>
