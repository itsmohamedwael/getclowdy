<svg xmlns="http://www.w3.org/2000/svg" width="700" height="230" viewBox="0 0 700 230" fill="none">
  <defs>
    <linearGradient id="scanBeamGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00D4FF" stop-opacity="0"/>
      <stop offset="70%" stop-color="#00D4FF" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#00FF88" stop-opacity="0.9"/>
    </linearGradient>

    <linearGradient id="scannerBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#040C14"/>
      <stop offset="100%" stop-color="#02060A"/>
    </linearGradient>

    <filter id="laserGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#00FF88" flood-opacity="0.6"/>
    </filter>

    <style>
      .scan-line {
        animation: scanMove 4s ease-in-out infinite;
      }
      .target-box {
        animation: boxGlow 2.5s ease-in-out infinite alternate;
      }
      .target-box2 {
        animation: boxGlow 2.5s ease-in-out infinite alternate 0.8s;
      }
      .target-box3 {
        animation: boxGlow 2.5s ease-in-out infinite alternate 1.6s;
      }
      .radar-blip {
        animation: blipFade 1.6s infinite ease-out;
      }
      @keyframes scanMove {
        0% { transform: translateY(0px); opacity: 0; }
        10% { opacity: 1; }
        90% { opacity: 1; }
        100% { transform: translateY(180px); opacity: 0; }
      }
      @keyframes boxGlow {
        0% { stroke-opacity: 0.4; }
        100% { stroke-opacity: 1; filter: drop-shadow(0 0 8px #00D4FF); }
      }
      @keyframes blipFade {
        0% { r: 2px; opacity: 1; }
        100% { r: 12px; opacity: 0; }
      }
    </style>
  </defs>

  <!-- Container -->
  <rect x="2" y="2" width="696" height="226" rx="14" fill="url(#scannerBg)" stroke="#00D4FF" stroke-width="1.2" stroke-opacity="0.35"/>

  <!-- Desktop Grid Backdrop -->
  <g opacity="0.08" stroke="#00D4FF" stroke-width="1">
    <line x1="2" y1="40" x2="698" y2="40" />
    <line x1="2" y1="80" x2="698" y2="80" />
    <line x1="2" y1="120" x2="698" y2="120" />
    <line x1="2" y1="160" x2="698" y2="160" />
    <line x1="2" y1="200" x2="698" y2="200" />
    <line x1="140" y1="2" x2="140" y2="228" />
    <line x1="280" y1="2" x2="280" y2="228" />
    <line x1="420" y1="2" x2="420" y2="228" />
    <line x1="560" y1="2" x2="560" y2="228" />
  </g>

  <!-- Top Status Strip -->
  <rect x="2" y="2" width="696" height="30" rx="14" fill="#061624" stroke="#00D4FF" stroke-width="0.5" stroke-opacity="0.2"/>
  <circle cx="20" cy="17" r="4.5" fill="#00FF88"/>
  <text x="32" y="21" fill="#8FFCFF" font-family="'Fira Code', monospace" font-size="11" font-weight="700" letter-spacing="0.5">
    MULTIMODAL SCREEN SCANNER — LIVE FRAME RECOGNITION (30 FPS)
  </text>
  <text x="670" y="21" text-anchor="end" fill="#00FF88" font-family="'Fira Code', monospace" font-size="10.5">
    FOV: 1920x1080 • LOSSLESS IN-MEMORY
  </text>

  <!-- Detected Object 1: Code Editor -->
  <g class="target-box" stroke="#00D4FF" stroke-width="1.4" fill="#00D4FF" fill-opacity="0.05">
    <rect x="36" y="52" width="220" height="140" rx="6" stroke-dasharray="8 4"/>
    <text x="46" y="72" fill="#00D4FF" font-family="'Fira Code', monospace" font-size="10.5" font-weight="700" stroke="none">
      [DETECTED: VS_CODE]
    </text>
    <text x="46" y="92" fill="#8FFCFF" font-family="'Fira Code', monospace" font-size="9" opacity="0.75" stroke="none">
      File: main.py | Line: 42
    </text>
    <text x="46" y="110" fill="#8FFCFF" font-family="'Fira Code', monospace" font-size="9" opacity="0.75" stroke="none">
      Def: ClowdyLive.run()
    </text>
    <path d="M46 160h60" stroke="#00D4FF" stroke-width="1"/>
    <text x="46" y="176" fill="#00FF88" font-family="'Fira Code', monospace" font-size="9.5" font-weight="600" stroke="none">
      STATUS: ACTIVE_FOCUSED
    </text>
  </g>

  <!-- Detected Object 2: Terminal -->
  <g class="target-box2" stroke="#FFB300" stroke-width="1.4" fill="#FFB300" fill-opacity="0.05">
    <rect x="280" y="52" width="180" height="140" rx="6" stroke-dasharray="8 4"/>
    <text x="290" y="72" fill="#FFB300" font-family="'Fira Code', monospace" font-size="10.5" font-weight="700" stroke="none">
      [DETECTED: CMD_SHELL]
    </text>
    <text x="290" y="92" fill="#FFE082" font-family="'Fira Code', monospace" font-size="9" opacity="0.75" stroke="none">
      Subprocess PID: 14208
    </text>
    <text x="290" y="110" fill="#FFE082" font-family="'Fira Code', monospace" font-size="9" opacity="0.75" stroke="none">
      PowerShell 7.4.1
    </text>
    <text x="290" y="176" fill="#00FF88" font-family="'Fira Code', monospace" font-size="9.5" font-weight="600" stroke="none">
      STATUS: AUTONOMOUS_READY
    </text>
  </g>

  <!-- Detected Object 3: Autonomous Game / Media Stream -->
  <g class="target-box3" stroke="#00FF88" stroke-width="1.4" fill="#00FF88" fill-opacity="0.05">
    <rect x="484" y="52" width="180" height="140" rx="6" stroke-dasharray="8 4"/>
    <text x="494" y="72" fill="#00FF88" font-family="'Fira Code', monospace" font-size="10.5" font-weight="700" stroke="none">
      [DETECTED: MEDIA_VISION]
    </text>
    <text x="494" y="92" fill="#A7F3D0" font-family="'Fira Code', monospace" font-size="9" opacity="0.75" stroke="none">
      Camera: Active (60 FPS)
    </text>
    <text x="494" y="110" fill="#A7F3D0" font-family="'Fira Code', monospace" font-size="9" opacity="0.75" stroke="none">
      Gestures: Tracking Hand
    </text>
    <text x="494" y="176" fill="#00D4FF" font-family="'Fira Code', monospace" font-size="9.5" font-weight="600" stroke="none">
      RPS GAME: READY
    </text>
  </g>

  <!-- Horizontal Animated Laser Beam -->
  <g class="scan-line" filter="url(#laserGlow)">
    <rect x="4" y="44" width="692" height="18" fill="url(#scanBeamGrad)"/>
    <line x1="4" y1="62" x2="696" y2="62" stroke="#00FF88" stroke-width="1.8"/>
  </g>
</svg>
