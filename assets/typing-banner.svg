<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 44" width="880" height="44" fill="none">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Fira+Code:wght@500;600&amp;display=swap');

      .banner-text {
        font-family: 'Fira Code', Consolas, 'Courier New', monospace;
        font-size: 18.5px;
        font-weight: 600;
        fill: #00D4FF;
        letter-spacing: 0.2px;
        opacity: 0;
        transform-origin: center;
      }

      .cursor {
        fill: #00FF88;
        animation: blink 0.8s infinite alternate;
      }

      @keyframes blink {
        0%, 40% { opacity: 1; }
        60%, 100% { opacity: 0; }
      }

      /* 18s cycle for 6 lines (3s each) */
      .l1 { animation: cycle1 18s infinite; }
      .l2 { animation: cycle2 18s infinite; }
      .l3 { animation: cycle3 18s infinite; }
      .l4 { animation: cycle4 18s infinite; }
      .l5 { animation: cycle5 18s infinite; }
      .l6 { animation: cycle6 18s infinite; }

      @keyframes cycle1 {
        0% { opacity: 0; transform: translateY(3px); }
        2%, 14.5% { opacity: 1; transform: translateY(0); }
        16.5%, 100% { opacity: 0; transform: translateY(-3px); }
      }
      @keyframes cycle2 {
        0%, 16.5% { opacity: 0; transform: translateY(3px); }
        18.5%, 31% { opacity: 1; transform: translateY(0); }
        33%, 100% { opacity: 0; transform: translateY(-3px); }
      }
      @keyframes cycle3 {
        0%, 33% { opacity: 0; transform: translateY(3px); }
        35%, 47.5% { opacity: 1; transform: translateY(0); }
        49.5%, 100% { opacity: 0; transform: translateY(-3px); }
      }
      @keyframes cycle4 {
        0%, 49.5% { opacity: 0; transform: translateY(3px); }
        51.5%, 64% { opacity: 1; transform: translateY(0); }
        66%, 100% { opacity: 0; transform: translateY(-3px); }
      }
      @keyframes cycle5 {
        0%, 66% { opacity: 0; transform: translateY(3px); }
        68%, 80.5% { opacity: 1; transform: translateY(0); }
        82.5%, 100% { opacity: 0; transform: translateY(-3px); }
      }
      @keyframes cycle6 {
        0%, 82.5% { opacity: 0; transform: translateY(3px); }
        84.5%, 97.5% { opacity: 1; transform: translateY(0); }
        99.5%, 100% { opacity: 0; transform: translateY(-3px); }
      }

      .glow-filter {
        filter: drop-shadow(0 0 8px rgba(0, 212, 255, 0.45));
      }
    </style>
  </defs>

  <g class="glow-filter">
    <!-- Line 1 -->
    <g class="banner-text l1">
      <text x="440" y="28" text-anchor="middle">
        Next-Gen Desktop AI Companion <tspan class="cursor">|</tspan>
      </text>
    </g>

    <!-- Line 2 -->
    <g class="banner-text l2">
      <text x="440" y="28" text-anchor="middle">
        Powered by Gemini 3.6 Flash Live Bidirectional Audio <tspan class="cursor">|</tspan>
      </text>
    </g>

    <!-- Line 3 -->
    <g class="banner-text l3">
      <text x="440" y="28" text-anchor="middle">
        Native Egyptian Dialect + Multilingual Fluency <tspan class="cursor">|</tspan>
      </text>
    </g>

    <!-- Line 4 -->
    <g class="banner-text l4">
      <text x="440" y="28" text-anchor="middle">
        Real-Time Screen Vision &amp; Autonomous PC Control <tspan class="cursor">|</tspan>
      </text>
    </g>

    <!-- Line 5 -->
    <g class="banner-text l5">
      <text x="440" y="28" text-anchor="middle">
        Live Melodic Singing with Authentic Arabic Maqamat <tspan class="cursor">|</tspan>
      </text>
    </g>

    <!-- Line 6 -->
    <g class="banner-text l6">
      <text x="440" y="28" text-anchor="middle">
        Zero-Latency Windows OS Automation Engine <tspan class="cursor">|</tspan>
      </text>
    </g>
  </g>
</svg>
