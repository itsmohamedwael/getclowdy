<svg xmlns="http://www.w3.org/2000/svg" width="700" height="260" viewBox="0 0 700 260" fill="none">
  <defs>
    <!-- Gradients -->
    <radialGradient id="coreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00D4FF" stop-opacity="1"/>
      <stop offset="40%" stop-color="#007A99" stop-opacity="0.8"/>
      <stop offset="75%" stop-color="#002233" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8FFCFF"/>
      <stop offset="50%" stop-color="#00D4FF"/>
      <stop offset="100%" stop-color="#005577"/>
    </linearGradient>

    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#05101A" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#02060A" stop-opacity="0.98"/>
    </linearGradient>

    <!-- Filters -->
    <filter id="bloom" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur1"/>
      <feGaussianBlur stdDeviation="10" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur2"/>
        <feMergeNode in="blur1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="hudShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#00D4FF" flood-opacity="0.25"/>
    </filter>

    <!-- Animation Keyframes -->
    <style>
      .spin-cw {
        transform-origin: 140px 130px;
        animation: spinClockwise 14s linear infinite;
      }
      .spin-ccw {
        transform-origin: 140px 130px;
        animation: spinCounterClockwise 18s linear infinite;
      }
      .spin-fast {
        transform-origin: 140px 130px;
        animation: spinClockwise 7s linear infinite;
      }
      .pulse-core {
        transform-origin: 140px 130px;
        animation: corePulse 2.4s ease-in-out infinite alternate;
      }
      .radar-sweep {
        transform-origin: 140px 130px;
        animation: radarSweep 4s linear infinite;
      }
      .flicker-text {
        animation: textGlow 3s ease-in-out infinite alternate;
      }
      .live-pulse {
        animation: liveBlink 1.4s ease-in-out infinite;
      }

      @keyframes spinClockwise {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
      @keyframes spinCounterClockwise {
        from { transform: rotate(360deg); }
        to { transform: rotate(0deg); }
      }
      @keyframes corePulse {
        0% { transform: scale(0.85); opacity: 0.75; }
        50% { transform: scale(1.12); opacity: 1; filter: drop-shadow(0 0 16px #00D4FF); }
        100% { transform: scale(0.85); opacity: 0.75; }
      }
      @keyframes radarSweep {
        0% { transform: rotate(0deg); opacity: 0.8; }
        100% { transform: rotate(360deg); opacity: 0.8; }
      }
      @keyframes textGlow {
        0% { opacity: 0.85; }
        100% { opacity: 1; filter: drop-shadow(0 0 6px #00D4FF); }
      }
      @keyframes liveBlink {
        0%, 100% { opacity: 1; transform: scale(1); }
        50% { opacity: 0.4; transform: scale(0.85); }
      }
    </style>
  </defs>

  <!-- Container Box -->
  <rect x="2" y="2" width="696" height="256" rx="16" fill="url(#cardBg)" stroke="#00D4FF" stroke-width="1.2" stroke-opacity="0.35" filter="url(#hudShadow)"/>

  <!-- Subtle Cyber Tech Grid Pattern -->
  <g opacity="0.08" stroke="#00D4FF" stroke-width="1">
    <line x1="2" y1="65" x2="698" y2="65" />
    <line x1="2" y1="130" x2="698" y2="130" />
    <line x1="2" y1="195" x2="698" y2="195" />
    <line x1="280" y1="2" x2="280" y2="258" />
    <line x1="490" y1="2" x2="490" y2="258" />
  </g>

  <!-- Corner Tech Accent Brackets -->
  <path d="M12 28 V12 H28" stroke="#00D4FF" stroke-width="2" fill="none" opacity="0.8"/>
  <path d="M688 28 V12 H672" stroke="#00D4FF" stroke-width="2" fill="none" opacity="0.8"/>
  <path d="M12 232 V248 H28" stroke="#00D4FF" stroke-width="2" fill="none" opacity="0.8"/>
  <path d="M688 232 V248 H672" stroke="#00D4FF" stroke-width="2" fill="none" opacity="0.8"/>

  <!-- ==================== LEFT: HOLOGRAPHIC AI CORE ==================== -->
  <g filter="url(#bloom)">
    <!-- Ambient Core Glow -->
    <circle cx="140" cy="130" r="90" fill="url(#coreGlow)"/>

    <!-- Outer Tech Ring (Clockwise) -->
    <circle class="spin-cw" cx="140" cy="130" r="76" stroke="#00D4FF" stroke-width="1.8" stroke-dasharray="14 8 2 8 35 12" stroke-opacity="0.75" fill="none"/>

    <!-- Middle Segmented Ring (Counter-Clockwise) -->
    <circle class="spin-ccw" cx="140" cy="130" r="58" stroke="#8FFCFF" stroke-width="2.2" stroke-dasharray="28 14 6 14" stroke-opacity="0.85" fill="none"/>

    <!-- Inner Fast Ring -->
    <circle class="spin-fast" cx="140" cy="130" r="42" stroke="#00D4FF" stroke-width="1.4" stroke-dasharray="8 6" stroke-opacity="0.6" fill="none"/>

    <!-- Central Pulsing Plasma Core -->
    <circle class="pulse-core" cx="140" cy="130" r="26" fill="#00D4FF" fill-opacity="0.9"/>
    <circle class="pulse-core" cx="140" cy="130" r="14" fill="#FFFFFF"/>
    
    <!-- Crosshairs & Cardinal Ticks -->
    <line x1="140" y1="46" x2="140" y2="56" stroke="#00D4FF" stroke-width="2" opacity="0.8"/>
    <line x1="140" y1="204" x2="140" y2="214" stroke="#00D4FF" stroke-width="2" opacity="0.8"/>
    <line x1="56" y1="130" x2="66" y2="130" stroke="#00D4FF" stroke-width="2" opacity="0.8"/>
    <line x1="214" y1="130" x2="224" y2="130" stroke="#00D4FF" stroke-width="2" opacity="0.8"/>
  </g>

  <!-- ==================== RIGHT: REAL-TIME TELEMETRY ==================== -->
  <g transform="translate(270, 36)">
    <!-- Header Badge -->
    <g>
      <rect x="0" y="0" width="168" height="24" rx="12" fill="#003344" stroke="#00D4FF" stroke-width="0.8" opacity="0.7"/>
      <circle class="live-pulse" cx="14" cy="12" r="4.5" fill="#00FF88"/>
      <text x="26" y="16" fill="#00FF88" font-family="'Fira Code', monospace" font-size="10.5" font-weight="700" letter-spacing="1">
        LIVE ENGINE READY
      </text>
    </g>

    <!-- Main Title -->
    <text class="flicker-text" x="0" y="52" fill="url(#neonCyan)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="21" font-weight="800" letter-spacing="0.5">
      CLOWDY NEURAL CORE v3.6
    </text>

    <!-- Telemetry Cards Grid -->
    <g transform="translate(0, 68)">
      <!-- Metric 1: Model -->
      <g>
        <rect x="0" y="0" width="190" height="48" rx="8" fill="#091824" stroke="#00D4FF" stroke-width="0.7" stroke-opacity="0.3"/>
        <text x="12" y="18" fill="#8FFCFF" font-family="'Fira Code', monospace" font-size="9.5" opacity="0.6">AI MODEL</text>
        <text x="12" y="38" fill="#FFFFFF" font-family="'Fira Code', monospace" font-size="13" font-weight="700">Gemini 3.6 Flash</text>
      </g>

      <!-- Metric 2: Latency -->
      <g transform="translate(202, 0)">
        <rect x="0" y="0" width="190" height="48" rx="8" fill="#091824" stroke="#00D4FF" stroke-width="0.7" stroke-opacity="0.3"/>
        <text x="12" y="18" fill="#8FFCFF" font-family="'Fira Code', monospace" font-size="9.5" opacity="0.6">STREAM LATENCY</text>
        <text x="12" y="38" fill="#00FF88" font-family="'Fira Code', monospace" font-size="13" font-weight="700">&lt; 320ms (Direct)</text>
      </g>

      <!-- Metric 3: Personality Dialect -->
      <g transform="translate(0, 56)">
        <rect x="0" y="0" width="190" height="48" rx="8" fill="#091824" stroke="#00D4FF" stroke-width="0.7" stroke-opacity="0.3"/>
        <text x="12" y="18" fill="#8FFCFF" font-family="'Fira Code', monospace" font-size="9.5" opacity="0.6">DIALECT &amp; EMOTION</text>
        <text x="12" y="38" fill="#FFB300" font-family="'Fira Code', monospace" font-size="12.5" font-weight="700">Egyptian Gen-Z + Sing</text>
      </g>

      <!-- Metric 4: OS Control -->
      <g transform="translate(202, 56)">
        <rect x="0" y="0" width="190" height="48" rx="8" fill="#091824" stroke="#00D4FF" stroke-width="0.7" stroke-opacity="0.3"/>
        <text x="12" y="18" fill="#8FFCFF" font-family="'Fira Code', monospace" font-size="9.5" opacity="0.6">WINDOWS AGENT</text>
        <text x="12" y="38" fill="#29B6F6" font-family="'Fira Code', monospace" font-size="12.5" font-weight="700">35+ Tool Controllers</text>
      </g>
    </g>
  </g>
</svg>
