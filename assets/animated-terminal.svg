<svg xmlns="http://www.w3.org/2000/svg" width="720" height="300" viewBox="0 0 720 300" fill="none">
  <defs>
    <linearGradient id="termGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050E17" />
      <stop offset="100%" stop-color="#02070D" />
    </linearGradient>
    <filter id="boxGlow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#00D4FF" flood-opacity="0.2"/>
    </filter>
    <style>
      .msg-line {
        font-family: 'Fira Code', 'Cascadia Code', Consolas, 'Courier New', monospace;
        font-size: 13.5px;
        opacity: 0;
        animation: typeIn 12s infinite;
      }
      .l1 { animation-delay: 0.2s; fill: #00FF88; font-weight: 600; }
      .l2 { animation-delay: 1.8s; fill: #E0F7FA; }
      .l3 { animation-delay: 3.6s; fill: #00D4FF; font-weight: 500; }
      .l4 { animation-delay: 5.4s; fill: #FFB300; }
      .l5 { animation-delay: 6.8s; fill: #00FF88; }
      .l6 { animation-delay: 8.0s; fill: #29B6F6; }

      @keyframes typeIn {
        0% { opacity: 0; transform: translateY(4px); }
        5%, 85% { opacity: 1; transform: translateY(0); }
        95%, 100% { opacity: 0; transform: translateY(-2px); }
      }

      .cursor {
        animation: cursorBlink 0.8s infinite alternate;
      }
      @keyframes cursorBlink {
        0% { opacity: 0; }
        100% { opacity: 1; }
      }

      .pulse-dot {
        animation: radarPulse 1.8s infinite alternate ease-in-out;
      }
      @keyframes radarPulse {
        0% { r: 4px; opacity: 0.5; }
        100% { r: 6.5px; opacity: 1; }
      }
    </style>
  </defs>

  <!-- Terminal Window Outer Frame -->
  <rect x="2" y="2" width="716" height="296" rx="14" fill="url(#termGrad)" stroke="#00D4FF" stroke-width="1.2" stroke-opacity="0.4" filter="url(#boxGlow)"/>

  <!-- Top Title Bar -->
  <path d="M2 16C2 8.26801 8.26801 2 16 2H704C711.732 2 718 8.26801 718 16V38H2V16Z" fill="#0A1826" stroke="#00D4FF" stroke-width="0.5" stroke-opacity="0.3"/>
  
  <!-- Window Controls -->
  <circle cx="22" cy="20" r="5" fill="#FF5F56" />
  <circle cx="38" cy="20" r="5" fill="#FFBD2E" />
  <circle cx="54" cy="20" r="5" fill="#27C93F" />

  <!-- Live Pulse Dot & Title -->
  <circle class="pulse-dot" cx="240" cy="20" r="5" fill="#00FF88" />
  <text x="254" y="24" fill="#8FFCFF" font-family="'Fira Code', monospace" font-size="11.5" font-weight="600" letter-spacing="0.5">
    CLOWDY HUD v3.6-FLASH — GEMINI LIVE BIDIRECTIONAL STREAM
  </text>

  <!-- Terminal Content Lines -->
  <g transform="translate(24, 66)">
    <!-- Line 1: Connection Info -->
    <text class="msg-line l1" x="0" y="0">
      ● [SESSION OPEN] 3.6-flash live audio stream (RTT: 260ms) | Egyptian Mode: ACTIVE
    </text>

    <!-- Line 2: User Input -->
    <text class="msg-line l2" x="0" y="34">
      👤 USER: "يسطا شغل أغنية رايقة، ظبط الصوت 50%، ونضفلي الديسكتوب"
    </text>

    <!-- Line 3: Assistant Reply -->
    <text class="msg-line l3" x="0" y="70">
      ☁️ CLOWDY: "عنيا يا باشا! نضفتلك الديسكتوب، الصوت 50%، ومشغل تراك عظمة.. روق يا نجم!"
    </text>

    <!-- Line 4: System Tool 1 -->
    <text class="msg-line l4" x="0" y="106">
      ⚡ [EXEC] desktop_control(action="organize", mode="by_type") → 24 files sorted ✓
    </text>

    <!-- Line 5: System Tool 2 -->
    <text class="msg-line l5" x="0" y="138">
      ⚡ [EXEC] computer_settings(action="set_volume", level=50) → Volume set to 50% ✓
    </text>

    <!-- Line 6: System Tool 3 -->
    <text class="msg-line l6" x="0" y="170">
      ⚡ [EXEC] youtube_video(search="أغاني رايقة هادية") → Live Streaming Audio 🎵
    </text>

    <!-- Interactive Blinking Prompt Cursor -->
    <text x="0" y="202" fill="#00D4FF" font-family="'Fira Code', monospace" font-size="13.5" font-weight="600">
      ❯ <tspan class="cursor" fill="#00FF88">█</tspan>
    </text>
  </g>
</svg>
